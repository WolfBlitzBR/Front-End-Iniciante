<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards de Cursos</title>
    <link rel="stylesheet" href="a.css">
</head>
<body>

    <main class="container">
        <h1 class="titulo-pagina">Curso</h1>

        <div class="card">
            <h2>Front-End: <span class="destaque-amarelo">R$ 500</span></h2>
            <p>Formação básica <span class="destaque-subtil">20h</span>, com <span class="destaque-subtil">Aulas</span> Práticas.</p>
            <button class="btn-comprar">Comprar Curso</button>
        </div>

        <div class="card">
            <h2>UX e Design Thinking: <span class="destaque-amarelo">R$ 300</span></h2>
            <p>Formação básica <span class="destaque-subtil">20h</span>, com <span class="destaque-subtil">Aulas</span> Práticas.</p>
            <button class="btn-comprar">Comprar Curso</button>
        </div>

        <div class="card">
            <h2>aaaaaaaaaaa</h2>
        </div>
    </main>

</body>
</html>
